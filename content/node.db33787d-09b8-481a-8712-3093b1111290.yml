            }),
          )
          .query(<span class="hljs-keyword">async</span> ({ input }) =&gt; {
            <span class="hljs-comment">// (some db code sets posts)</span>
            <span class="hljs-keyword">return</span> posts <span class="hljs-keyword">as</span> { <span class="hljs-attr">id</span>: string, <span class="hljs-attr">text</span>: string }[]
          },
        <span class="hljs-attr">createPost</span>: publicProcedure
          .input(
            z.object({
              <span class="hljs-attr">slug</span>: z.string().nonempty(),
              <span class="hljs-attr">text</span>: z.string().nonempty(),
            }),
          )
          .mutation(<span class="hljs-keyword">async</span> ({ input }) =&gt; {
            <span class="hljs-comment">// (some db code inserts a post)</span>
            <span class="hljs-keyword">return</span> { <span class="hljs-attr">postId</span>: id }
          },
      });

      <span class="hljs-comment">// We can define an in-memory Map we'll use</span>
      <span class="hljs-comment">// for post CRUD operations. It can (and should)</span>
      <span class="hljs-comment">// include some initial data.</span>
      <span class="hljs-comment">//</span>
      <span class="hljs-comment">// Note that the value type is inferred from the</span>
      <span class="hljs-comment">// response of a route - this feels weird, but is</span>
      <span class="hljs-comment">// really ergonomic if many routes share a response shape.</span>
      <span class="hljs-keyword">const</span> postsStore = <span class="hljs-keyword">new</span> <span class="hljs-built_in">Map</span>&lt;string, RouterOutput[<span class="hljs-string">"listPosts"</span>][number]&gt;(
        [
          <span class="hljs-string">"I am a default, hardcoded post"</span>,
          <span class="hljs-string">"And so am I!"</span>,
        ].map(
          <span class="hljs-function"><span class="hljs-params">text</span> =&gt;</span> {
            <span class="hljs-keyword">const</span> id = crypto.randomUUID()
            <span class="hljs-keyword">return</span> [id, { id, text }]
          }
        )
      );

      <span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> demoRoutes: DemoRoutes = {
        <span class="hljs-comment">// Mocking listings is quite easy</span>
        <span class="hljs-attr">listPosts</span>: <span class="hljs-function"><span class="hljs-params">()</span> =&gt;</span> ([...postsStore.values()]),
        <span class="hljs-comment">// And mutating data is also not too bad</span>
        <span class="hljs-attr">createPost</span>: <span class="hljs-function">(<span class="hljs-params">{ text }</span>) =&gt;</span> {
          <span class="hljs-keyword">const</span> id = crypto.randomUUID();
          postsStore.set(id, { id, text });
          <span class="hljs-keyword">return</span> { <span class="hljs-attr">postId</span>: id };
        },
      };
      </code></pre><p>As you can see, it’s kind of a can of worms for how complex you want your demo to be! I think static, read-only demo data is totally serviceable to show off a product as well, if you want to avoid the “uncanny valley” of how real your demo feels.</p>
      <p>With all this done, my demo was ready! Note that I did break my vow of simplicity and add some “are we in the demo?” code within my React tree, but most exceptions were done for valid UX reasons (ex: disabling buttons that would never work, showing a demo banner, etc.).</p>
      <p>I’m aware that this post is pretty tRPC specific, but I think this kind of API mocking applies to any SPA that uses TypeScript. If your product doesn’t have a demo already, this is a surprisingly nice way to build one! Or, at the very least, feels a lot more clean than mocking data directly in React.</p>
      <p>If you’re interested in seeing the code above in action, I created a small repository you can try out locally: <a href="https://github.com/mortenson/trpc-demo-link">https://github.com/mortenson/trpc-demo-link</a> . The bulk of the interesting code lives in the <a href="https://github.com/mortenson/trpc-demo-link/blob/main/client/src/utils/demoLink.ts">tRPC link</a> and the actual <a href="https://github.com/mortenson/trpc-demo-link/blob/main/client/src/utils/demoRoutes.ts">demo mocks</a>. That repo also includes <a href="https://trpc.io/docs/server/subscriptions">tRPC subscription</a> support, which was quite tricky to get right (if I got it right at all).</p>
      <p>The real product demo I did all this work for can be viewed at <a href="https://sevhunt.com/o/_demo">https://sevhunt.com/o/_demo</a>, which also includes a short tour. I recently added support for quite a lot of mutability there, which definitely makes it feel more alive (although, I somewhat question if it was worth the headache).</p>
      <p>Regardless of how you do it, building a great demo is really important for selling a product. Bonus points for demos like the one described above, where users can engage without signing up or talking to sales. Happy building out there!</p>
